<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quiz: História da Internet</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #005813;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: #04fa56;
            margin-top: 40px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 2px solid #1eb400;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        .question {
            font-size: 20px;
            margin-bottom: 15px;
            color: #444;
        }

        .options {
            list-style: none;
            padding: 0;
        }

        .options li {
            margin-bottom: 10px;
        }

        .options button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #1eb400;
            border-radius: 5px;
            background-color: #ffffff;
            cursor: pointer;
            transition: 0.3s;
        }

        .options button:hover {
            background-color: #00550b;
            color: white;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
        }

        .next-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #19b83e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .result {
            text-align: center;
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="cadastro" class="container" style="display: block;">
        <h2>Início do Quiz</h2>
        <p>Preencha os dados para começar.</p>
        <div class="form-group">
            <label for="alunoNome">Nome:</label>
            <input type="text" id="alunoNome" class="form-control" placeholder="Seu nome completo" required>
        </div>
        <div class="form-group">
            <label for="alunoTurma">Turma:</label>
            <input type="text" id="alunoTurma" class="form-control" placeholder="Ex: 8A" required>
        </div>
        <br>
        <button onclick="iniciarQuiz()" style="width: 100%; padding: 15px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Começar o Quiz</button>
    </div>

    <div class="container" id="quizContainer" style="display: none;">
        <h1>Quiz: História da Internet</h1>
        <div id="quiz">
            <p class="question" id="question">Carregando pergunta...</p>
            <ul class="options" id="options"></ul>
            <p class="feedback" id="feedback"></p>
            <button class="next-btn" id="nextButton">Próxima</button>
        </div>
        <div class="result" id="result"></div>
    </div>

        const resultEl = document.getElementById("result");
        const quizContainer = document.getElementById("quizContainer");

        function iniciarQuiz() {
            studentName = document.getElementById("alunoNome").value;
            studentClass = document.getElementById("alunoTurma").value;

            if (studentName.trim() === '' || studentClass.trim() === '') {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            document.getElementById("cadastro").style.display = "none";
            quizContainer.style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            feedbackEl.textContent = "";
            nextButton.style.display = "none";
            const q = quizData[currentQuestion];
            questionEl.textContent = q.question;
            optionsEl.innerHTML = "";

                const btn = document.createElement("button");
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option);
                const li = document.createElement("li");
                li.appendChild(btn);
                optionsEl.appendChild(li);
            });
        }
